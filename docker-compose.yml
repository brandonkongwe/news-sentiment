services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-news_sentiment}
      MYSQL_USER: ${MYSQL_USER:-newsuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-newssecret}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  web:
    build:
      context: .
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DEBUG=False
      - ALLOWED_HOSTS=localhost,127.0.0.1
      - DB_NAME=${DB_NAME}
      - USER=${DB_USER}
      - PASSWORD=${DB_PASSWORD}
      - HOST=db
      - PORT=3306
      - SECRET_KEY=${SECRET_KEY}
    depends_on:
      - db
      - redis

  worker:
    build:
      context: .
    command: celery -A config worker -l info
    env_file:
      - .env
    environment:
      - DB_NAME=${DB_NAME}
      - USER=${DB_USER}
      - PASSWORD=${DB_PASSWORD}
      - HOST=db
      - PORT=3306
      - SECRET_KEY=${SECRET_KEY}
    depends_on:
      - db
      - redis

  beat:
    build:
      context: .
    command: celery -A config beat -l info
    env_file:
      - .env
    environment:
      - DB_NAME=${DB_NAME}
      - USER=${DB_USER}
      - PASSWORD=${DB_PASSWORD}
      - HOST=db
      - PORT=3306
      - SECRET_KEY=${SECRET_KEY}
    depends_on:
      - db
      - redis

volumes:
  db_data:
